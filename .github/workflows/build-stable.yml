name: Build and verify stable installer

on:
  workflow_call:
    outputs:
      artifact_id:
        description: Immutable artifact ID from this run
        value: ${{ jobs.build.outputs.artifact_id }}
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1457423459'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Require stable repository identity
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: test "$REPOSITORY_ID" = "1457423459"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate source, tests, installer structure and extraction
        run: python -B tools/package_release.py
      - name: Verify checksum and ZIP with native tools
        run: |
          cd dist
          sha256sum --check *.zip.sha256
          unzip -t *.zip
      - name: Upload immutable validated build
        id: artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
